<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="Style.css" />
  </head>
  <body>
    <div class="auth-bg">
      <div class="auth-container">
        <!-- Logo -->
        <div class="auth-header">
          <div class="logo"><span>JEKI</span>Shop</div>
        </div>

        <!-- Form Register -->
        <div class="auth-body">
          <h2>Buat Akun Baru</h2>

          <form action="Login.html" method="get">
              <div class="form-group">
                <label for="reg-username">Username</label>
                <input
                  type="text"
                  id="reg-username"
                  placeholder="Username"
                  class="colom"
                  name="username"
                  required
                />
              </div>

              <div class="form-group">
                <label for="reg-umur">Umur</label>
                <input
                  type="number"
                  id="reg-umur"
                  placeholder="Umur"
                  class="colom"
                  name="password"
                  required
                  minlength="6"
                />
              </div>
            </div>

            <div class="form-group">
              <label for="reg-email">Email</label>
              <input
                type="email"
                id="reg-email"
                placeholder="user@email.com"
                class="colom"
                name="email"
                required
              />
            </div>

            <div class="form-group">
              <label for="reg-alamat">Alamat</label>
              <input
                type="text"
                id="reg-alamat"
                placeholder="Alamat"
                class="colom"
                name="confirm_password"
                required
              />
            </div>

            <div class="form-group">
              <label for="reg-password">Password</label>
              <input
                type="password"
                id="reg-password"
                placeholder="Minimal 6 karakter"
                class="colom"
                name="full_name"
                required
              />
            </div>

            <!-- Tombol Register -->
            <button type="submit" class="btn-primary">Daftar Sekarang</button>
          </form>

          <div class="auth-footer">
            Sudah punya akun? <a href="Login.html">Masuk di sini</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
